<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Exercise 13</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background-color: pink;
      margin: 20px;
      transition: width 1s, height 1s;
    }

    #box1:hover {
      width: 600px;
    }

    #box2:hover {
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>
  <div class="box" id="box1">1</div>
  <div class="box" id="box2">2</div>
</body>
</html>
